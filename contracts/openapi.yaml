openapi: 3.1.0
info:
  title: reqlogue API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/mindmap:
    post:
      operationId: updateMindmap
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MindmapAudio"
      responses:
        "200":
          description: Transcript of the audio and the complete markmap Markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MindmapTurn"
        "503":
          description: Mindmap generator is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unavailable"
  /v1/advice:
    post:
      operationId: analyzeAdvice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdviceAnalysis"
      responses:
        "200":
          description: At most two advice items from the new transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdviceBatch"
        "503":
          description: Advice analyzer is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unavailable"
  /v1/requirements:
    post:
      operationId: writeRequirements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementsDraft"
      responses:
        "200":
          description: Seven-section requirements Markdown for the ended meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementsDocument"
        "503":
          description: Requirements drafter is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unavailable"
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    MindmapAudio:
      type: object
      additionalProperties: false
      required: [meetingId, previousMarkdown, audio]
      properties:
        meetingId:
          type: string
          minLength: 1
        previousMarkdown:
          type: string
        audio:
          type: string
          format: binary
          description: PCM16 mono 24 kHz little-endian
    MindmapTurn:
      type: object
      additionalProperties: false
      required: [markdown, transcript]
      properties:
        markdown:
          type: string
        transcript:
          type: string
    AdviceAnalysis:
      type: object
      additionalProperties: false
      required: [meetingId, transcriptDelta, notifiedThemes]
      properties:
        meetingId:
          type: string
          minLength: 1
        transcriptDelta:
          type: string
        notifiedThemes:
          type: array
          items:
            type: string
    AdviceItem:
      type: object
      additionalProperties: false
      required: [title, reason, suggestedQuestion, quote]
      properties:
        title:
          type: string
        reason:
          type: string
        suggestedQuestion:
          type: string
        quote:
          type: string
    AdviceBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/AdviceItem"
    RequirementsDetection:
      type: object
      additionalProperties: false
      required: [title, reason, suggestedQuestion, quote, column]
      properties:
        title:
          type: string
        reason:
          type: string
        suggestedQuestion:
          type: string
        quote:
          type: string
        column:
          type: string
          enum: [advice, doing, done]
    RequirementsDraft:
      type: object
      additionalProperties: false
      required: [meetingId, meetingName, utterances, detections]
      properties:
        meetingId:
          type: string
          minLength: 1
        meetingName:
          type: string
        utterances:
          type: array
          items:
            type: string
        detections:
          type: array
          items:
            $ref: "#/components/schemas/RequirementsDetection"
    RequirementsDocument:
      type: object
      additionalProperties: false
      required: [markdown]
      properties:
        markdown:
          type: string
    Unavailable:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [unavailable]
