asyncapi: 2.6.0
info:
  title: reqlogue live transcription
  version: 0.1.0
servers:
  api:
    url: http://127.0.0.1:8000
    protocol: ws
channels:
  /v1/transcription/stream:
    description: >
      One live transcription session. The client appends PCM16 mono 24 kHz
      audio, then sends stop. The server forwards gpt-live-transcribe deltas
      as they arrive and closes the socket after the final turn.
    bindings:
      ws:
        query:
          type: object
          properties:
            overview:
              type: string
              description: Meeting overview used as the transcription prompt
    publish:
      message:
        oneOf:
          - name: audio
            payload:
              type: string
              format: binary
          - name: stop
            payload:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [stop]
    subscribe:
      message:
        name: transcriptDelta
        payload:
          type: object
          required: [text]
          properties:
            text:
              type: string
              description: Incremental transcript text, including boundary spaces
