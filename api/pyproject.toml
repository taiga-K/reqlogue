[project]
name = "reqlogue-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2024.8",
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn[standard]>=0.32",
  "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reqlogue_api"]

[tool.hatch.build.targets.wheel.sources]
"src/reqlogue_api" = "reqlogue_api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/reqlogue_api/infrastructure/advice_system_prompt.py" = ["E501"]
"src/reqlogue_api/infrastructure/requirements_system_prompt.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["reqlogue_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
