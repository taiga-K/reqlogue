# Official Actions only. Adapted for the pnpm workspace.
# Playwright GitHub Action is deprecated; install browsers via CLI per Playwright docs.
name: frontend-verify

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: frontend-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium (for Storybook Vitest browser project)
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify
        run: pnpm --filter @reqlogue/web verify

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm --filter @reqlogue/web build
        env:
          NEXT_PUBLIC_API_MOCKING: enabled
      - name: E2E
        run: pnpm test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_API_MOCKING: enabled
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
